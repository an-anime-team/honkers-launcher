[package]
name = "honkers-launcher"
version = "1.14.1"
description = "Honkers launcher"
authors = ["Nikita Podvirnyi <krypt0nn@vk.com>"]
homepage = "https://github.com/an-anime-team/honkers-launcher"
repository = "https://github.com/an-anime-team/honkers-launcher"
license = "GPL-3.0-or-later"
edition = "2024"
build = "build.rs"
publish = false

[profile.release]
strip = true
lto = true
opt-level = "s"

[build-dependencies]
glib-build-tools = "0.22.8"

[dependencies.anime-launcher-sdk]
git = "https://github.com/an-anime-team/anime-launcher-sdk"
tag = "1.36.11"
features = ["all", "honkai"]

# path = "../anime-launcher-sdk" # ! for dev purposes only

[dependencies]
agl-locale = { git = "https://github.com/an-anime-team/anime-games-launcher" }

relm4 = { version = "0.11", features = ["macros", "libadwaita"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }

rfd = { version = "0.17", features = ["xdg-portal"], default-features = false }
open = "5.4"
whatadistro = "0.1.0"

serde_json = "1.0"
anyhow = "1.0"
cached = { version = "4.0", features = ["proc_macro"] }
md-5 = "0.11"
enum-ordinalize = "4.4"

tracing = "0.1"
tracing-subscriber = "0.3"

human-panic = "2.0.1"
